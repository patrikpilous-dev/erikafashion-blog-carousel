name: Denni refresh carousel.json

on:
  schedule:
    - cron: "30 4 * * *"   # denne 04:30 UTC = 06:30 CEST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # v7 bezi na Node 24; v4/v5 cilily na Node 20, ktery GitHub vypina
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # nove clanky ze sitemapy -> tematicke mapovani do pipeline/config.json
      - name: Namapovat nove clanky
        run: python pipeline/discover.py

      - name: Vygenerovat data carouselu
        run: python pipeline/refresh.py

      - name: Commit a push
        run: |
          git config user.name "carousel-bot"
          git config user.email "actions@github.com"
          git add -A a index.json pipeline/config.json
          # commit vzdy (i kdyz se data nezmenila, meni se timestamp "generated") —
          # denni commit drzi repo aktivni, takze GitHub scheduled workflow nikdy
          # nevypne pro 60 dni neaktivity
          git commit -m "refresh $(date -u +%F)" || echo "nic ke commitu"
          git push
